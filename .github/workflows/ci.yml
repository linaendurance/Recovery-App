name: CI

# Nothing ran tests or the build on push before this. A green branch was an
# assumption, not a fact.
on:
  push:
    branches: ["**"]
  pull_request:

# A second push supersedes the first. Without this, every push queues a full
# duplicate run against a free-tier minute budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First job deliberately, and with no npm install: the static guardrails are
  # pure grep/python and finish in seconds. A service-role key imported into
  # client code should fail in ten seconds, not after a three-minute build.
  #
  # Check 2 (secrets in the compiled bundle) needs .next, which does not exist
  # here — the script reports that honestly and the verify job re-runs it after
  # the build, where the answer is knowable.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static security guardrails
        run: ./scripts/security-checks.sh

  verify:
    runs-on: ubuntu-latest
    # A hung job otherwise runs until GitHub's 6-hour default kills it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Type errors are build failures in Next, but running tsc directly gives
      # a clearer signal and catches things the build tolerates.
      - name: Type check
        run: npx tsc --noEmit

      # ESLint's react-hooks rules are the ONLY check that catches a hook
      # called after an early return. The build, tsc and the unit tests all
      # passed while Today and Summary crashed on load.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        # Configuration is mandatory (see README "Configuration"), so the build
        # needs values. CI verifies that the code COMPILES, not that it can
        # reach a real database — so it falls back to a placeholder rather than
        # requiring repository variables to be configured before CI can pass.
        # Set the real values as Actions variables only if you want CI to build
        # against the true project ref.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run build

      # Re-run now that .next exists. The static checks are cheap to repeat and
      # this is the only moment the bundle scan can actually answer its
      # question: does a service_role JWT ship to the browser?
      - name: Secrets in build output
        run: ./scripts/security-checks.sh

      # Every JSON file must parse strictly. tsconfig.json previously contained
      # comments, which TypeScript accepts and JSON.parse does not.
      - name: Validate JSON files
        run: |
          for f in $(git ls-files '*.json' | grep -v package-lock); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "INVALID JSON: $f"; exit 1; }
            echo "ok: $f"
          done

      # Repo migration filenames must match the versions actually applied to
      # the database, or `supabase db push` silently re-runs them.
      - name: Migration filenames are unique and ordered
        run: |
          dupes=$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "duplicate migration versions: $dupes"; exit 1; fi
          echo "migration versions unique: $(ls supabase/migrations | wc -l) files"

      # Advisory visibility, deliberately NOT a gate: the open advisories are
      # only fixed in Next 15/16, so failing on them would mean a permanently
      # red pipeline that everyone learns to ignore.
      - name: Dependency advisories (informational)
        run: npm audit --audit-level=high || true

      # The restore path, proven rather than assumed: apply every migration to
      # an empty database and diff the result against the recorded schema.
      # Fails if a migration is missing from the repo, or if production was
      # changed outside of one.
      - name: Schema rebuilds from migrations
        run: ./scripts/rebuild-test.sh

  # Separate job: it needs a browser, so it should not slow the fast checks.
  #
  # This is the only check in the project that renders a component twice. Every
  # crash-level bug found so far — a Rules of Hooks violation that broke Today
  # and Summary on every load, and a null nested select that hung History
  # forever — was invisible to the build, the type checker and the unit tests,
  # and obvious here within seconds.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start fixture server
        run: |
          node scripts/mock-supabase.js 54321 &
          sleep 2
          curl -sf http://127.0.0.1:54321/auth/v1/user > /dev/null

      - name: Build and start against the fixture server
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
        run: |
          npm run build
          npm start &
          npx wait-on -t 60000 http://127.0.0.1:3000/login

      - name: Render every signed-in screen
        run: |
          mkdir -p shots
          npm run e2e

      # The screens rendering is not the same as the screens rendering
      # CORRECTLY WHEN A QUERY FAILS. Both data-loss bugs found in this project
      # were invisible to every other gate, including the run above.
      - name: Failure paths (silent data loss)
        run: npm run e2e:failures

      - name: Accessibility (WCAG 2.1 A + AA)
        run: npm run a11y

      - name: Mobile overflow and tap targets
        run: npm run audit:mobile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
